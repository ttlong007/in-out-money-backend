# Render blueprint.
#
# Deliberately declares the web service only — no database.
#
# Render's free Postgres is deleted 30 days after creation, and a personal
# finance app losing its history is not a tier limitation, it is data loss. The
# database lives on Neon instead, whose free tier is permanent, and reaches this
# service through DATABASE_URL.
#
# To use: push this repo to GitHub, then in Render pick "New → Blueprint" and
# point it here. The three `sync: false` values are prompted for on first deploy
# and never stored in this file.

services:
  - type: web
    name: inout-backend
    runtime: node
    plan: free
    # Matched to the database's region, not to Vietnam.
    #
    # One request from the phone crosses the ocean once; the handful of queries
    # that request makes cross it again each time. Co-locating the server with
    # the database is worth far more than putting it near the user:
    #   Ohio      — phone→server 250ms + 4×1ms   ≈ 254ms
    #   Singapore — phone→server 50ms  + 4×250ms ≈ 1050ms
    # Change this if the database ever moves.
    region: ohio

    buildCommand: npm ci
    startCommand: npm start

    # Render restarts the instance when this stops returning 2xx. The endpoint
    # runs a real query, so a server that is up with a dead database is
    # correctly reported as unhealthy rather than quietly accepting writes.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT; env.ts reads it. Do not hardcode one here.

      - key: DATABASE_URL
        sync: false # Neon connection string, including ?sslmode=require

      - key: JWT_SECRET
        # Generated by Render and never shown in the repo. Changing it signs
        # every user out, which is the intended panic button.
        generateValue: true

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ANTHROPIC_MODEL
        value: claude-opus-5

      # Gmail app password for password-reset emails. Optional — recovery
      # reports itself unavailable without them.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Empty is correct: the only real client is a React Native app, which
      # sends no Origin header. Name an origin here only for a web build.
      - key: CORS_ORIGINS
        value: ''
